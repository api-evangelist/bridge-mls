naftiko: 1.0.0-alpha2
info:
  label: Bridge RESO Web API — Member
  description: Query the RESO Member (agent) resource via Bridge's OData endpoint.
  tags: [Bridge, RESO, Member, Agents, MLS, OData]
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BRIDGE_ACCESS_TOKEN: BRIDGE_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: bridge-member
    baseUri: https://api.bridgedataoutput.com/api/v2/OData
    resources:
    - name: member
      path: /{dataset}/Member
      operations:
      - name: listMembers
        method: GET
        description: Query Member records.
        outputRawFormat: json
        inputParameters:
        - { name: dataset, in: path, type: string, required: true }
        - { name: $filter, in: query, type: string }
        - { name: $select, in: query, type: string }
        - { name: $top, in: query, type: integer }
        outputParameters:
        - { name: result, type: object, value: $. }
    authentication:
      type: apikey
      key: access_token
      value: '{{env.BRIDGE_ACCESS_TOKEN}}'
      placement: query
  exposes:
  - type: mcp
    namespace: bridge-member-mcp
    port: 9090
    transport: http
    tools:
    - name: bridge-list-members
      description: Search real estate agents via Bridge RESO Web API.
      hints: { readOnly: true, destructive: false, idempotent: true }
      call: bridge-member.listMembers
      with:
        dataset: tools.dataset
        $filter: tools.filter
        $select: tools.select
        $top: tools.top
      outputParameters:
      - { type: object, mapping: $. }
