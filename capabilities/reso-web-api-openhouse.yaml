naftiko: 1.0.0-alpha2
info:
  label: Bridge RESO Web API — OpenHouse
  description: Query the RESO OpenHouse resource via Bridge's OData endpoint.
  tags: [Bridge, RESO, OpenHouse, MLS, OData]
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys: { BRIDGE_ACCESS_TOKEN: BRIDGE_ACCESS_TOKEN }
capability:
  consumes:
  - type: http
    namespace: bridge-openhouse
    baseUri: https://api.bridgedataoutput.com/api/v2/OData
    resources:
    - name: openhouse
      path: /{dataset}/OpenHouse
      operations:
      - name: listOpenHouses
        method: GET
        description: Query OpenHouse records.
        outputRawFormat: json
        inputParameters:
        - { name: dataset, in: path, type: string, required: true }
        - { name: $filter, in: query, type: string }
        - { name: $top, in: query, type: integer }
        outputParameters:
        - { name: result, type: object, value: $. }
    authentication:
      type: apikey
      key: access_token
      value: '{{env.BRIDGE_ACCESS_TOKEN}}'
      placement: query
  exposes:
  - type: mcp
    namespace: bridge-openhouse-mcp
    port: 9090
    transport: http
    tools:
    - name: bridge-list-open-houses
      description: Search open houses via Bridge RESO Web API.
      hints: { readOnly: true, destructive: false, idempotent: true }
      call: bridge-openhouse.listOpenHouses
      with: { dataset: tools.dataset, $filter: tools.filter, $top: tools.top }
      outputParameters:
      - { type: object, mapping: $. }
