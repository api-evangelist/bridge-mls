naftiko: 1.0.0-alpha2
info:
  label: Bridge Webhooks — Endpoints
  description: Manage Bridge webhook endpoints that receive real-time MLS change events.
  tags: [Bridge, Webhooks, Events, Real-time]
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys: { BRIDGE_ACCESS_TOKEN: BRIDGE_ACCESS_TOKEN }
capability:
  consumes:
  - type: http
    namespace: bridge-webhooks
    baseUri: https://api.bridgedataoutput.com/api/v2
    resources:
    - name: webhooks
      path: /{dataset}/webhooks
      operations:
      - name: listWebhooks
        method: GET
        description: List webhook endpoints for the dataset.
        outputRawFormat: json
        inputParameters:
        - { name: dataset, in: path, type: string, required: true }
        outputParameters:
        - { name: result, type: object, value: $. }
      - name: createWebhook
        method: POST
        description: Create a webhook endpoint (starts disabled).
        outputRawFormat: json
        inputParameters:
        - { name: dataset, in: path, type: string, required: true }
        - { name: body, in: body, type: object, required: true }
        outputParameters:
        - { name: result, type: object, value: $. }
    - name: webhook-by-id
      path: /{dataset}/webhooks/{webhookId}
      operations:
      - name: getWebhook
        method: GET
        description: Get a webhook endpoint.
        outputRawFormat: json
        inputParameters:
        - { name: dataset, in: path, type: string, required: true }
        - { name: webhookId, in: path, type: string, required: true }
        outputParameters:
        - { name: result, type: object, value: $. }
      - name: deleteWebhook
        method: DELETE
        description: Delete a webhook endpoint.
        outputRawFormat: json
        inputParameters:
        - { name: dataset, in: path, type: string, required: true }
        - { name: webhookId, in: path, type: string, required: true }
        outputParameters:
        - { name: result, type: object, value: $. }
    authentication:
      type: apikey
      key: access_token
      value: '{{env.BRIDGE_ACCESS_TOKEN}}'
      placement: query
  exposes:
  - type: mcp
    namespace: bridge-webhooks-mcp
    port: 9090
    transport: http
    tools:
    - name: bridge-list-webhooks
      description: List Bridge webhook endpoints.
      hints: { readOnly: true, destructive: false, idempotent: true }
      call: bridge-webhooks.listWebhooks
      with: { dataset: tools.dataset }
      outputParameters:
      - { type: object, mapping: $. }
    - name: bridge-create-webhook
      description: Create a new Bridge webhook endpoint.
      hints: { readOnly: false, destructive: false, idempotent: false }
      call: bridge-webhooks.createWebhook
      with: { dataset: tools.dataset, body: tools.body }
      outputParameters:
      - { type: object, mapping: $. }
    - name: bridge-delete-webhook
      description: Delete a Bridge webhook endpoint.
      hints: { readOnly: false, destructive: true, idempotent: true }
      call: bridge-webhook-by-id.deleteWebhook
      with: { dataset: tools.dataset, webhookId: tools.webhookId }
      outputParameters:
      - { type: object, mapping: $. }
