openapi: 3.2.0
info:
  title: Bridge Web Open Houses API
  version: '2.0'
  description: 'Bridge''s native (non-OData) RESTful Web API. Returns the same RESO-normalized resources as the

    OData endpoint but in a flatter JSON envelope optimized for clients that don''t want the OData

    metadata layer. All requests are scoped to a `{dataset}` and authenticated with an `access_token`.'
  contact:
    name: Bridge Interactive Support
    email: support@bridgeinteractive.com
servers:
- url: https://api.bridgedataoutput.com/api/v2
  description: Production v2
security:
- AccessToken: []
tags:
- name: Open Houses
paths:
  /{dataset}/openhouses:
    get:
      tags:
      - Open Houses
      summary: List Open Houses
      operationId: listOpenHouses
      parameters:
      - $ref: '#/components/parameters/Dataset'
      responses:
        '200':
          description: OpenHouse collection
          content:
            application/json:
              schema:
                type: object
components:
  parameters:
    Dataset:
      name: dataset
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    AccessToken:
      type: apiKey
      in: query
      name: access_token
